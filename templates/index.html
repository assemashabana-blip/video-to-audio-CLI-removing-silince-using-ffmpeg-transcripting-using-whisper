<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Transcriber</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>YouTube Transcriber</h1>

        <form id="job-form">
            <input type="text" id="video-path" name="video_path"
                   placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
            <button type="submit">Start</button>
        </form>

        <p id="status">Idle</p>
        <ul id="files"></ul>
    </div>

<script>
const form = document.getElementById("job-form");
const statusText = document.getElementById("status");
const fileList = document.getElementById("files");

form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const url = document.getElementById("video-path").value.trim();
    if (url === "") {
        statusText.textContent = "Paste a YouTube URL first";
        statusText.className = "failed";
        return;
    }

    fileList.innerHTML = "";
    statusText.textContent = "Starting...";
    statusText.className = "working";

    const formData = new FormData();
    formData.append("video_path", url);

    try {
        const response = await fetch("/process", { method: "POST", body: formData });
        const jobId = await response.text();

        statusText.textContent = "Downloading and transcribing...";
        statusText.className = "working";
        poll(jobId);
    } catch (error) {
        statusText.textContent = "Could not reach the server";
        statusText.className = "failed";
    }
});

function poll(jobId) {
    const timer = setInterval(async function () {
        let data;
        try {
            const response = await fetch("/status/" + jobId);
            data = await response.json();
        } catch (error) {
            clearInterval(timer);
            statusText.textContent = "Lost connection to the server";
            statusText.className = "failed";
            return;
        }

        if (data.status === "Done") {
            clearInterval(timer);
            statusText.textContent = "Done";
            statusText.className = "done";
            showFiles(jobId, data.files);
        } else if (data.status === "Failed") {
            clearInterval(timer);
            statusText.textContent = "Failed: " + (data.error || "unknown error");
            statusText.className = "failed";
        }
    }, 2000);
}

function showFiles(jobId, files) {
    const labels = {
        audio: "Audio",
        transcript: "Transcript"
    };

    for (const [key, path] of Object.entries(files)) {
        const item = document.createElement("li");
        const link = document.createElement("a");

        link.href = "/download/" + jobId + "/" + key;
        link.textContent = labels[key] || key;
        link.title = path;

        item.appendChild(link);
        fileList.appendChild(item);
    }
}
</script>
</body>
</html>
